version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: jssg_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jssg
      POSTGRES_PASSWORD: jssg_secret
      POSTGRES_DB: jssg_db
    ports:
      - "5432:5432"
    volumes:
      - jssg_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jssg -d jssg_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jssg_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - jssg_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jssg_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://jssg:jssg_secret@db:5432/jssg_db
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./:/app

volumes:
  jssg_pgdata:
  jssg_redisdata: